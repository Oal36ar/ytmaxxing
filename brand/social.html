<!doctype html><html><head><meta charset="utf-8">
<!-- GitHub social preview, brand v2 (the press look, 27 Nov 2026). Render with brand/render.py: 1280×640 → assets/social-preview.png.
     Upload it in the repo's Settings → Social preview (Omar's yes first). Stock card; the XX mark printed in cobalt ASCII;
     the serif wordmark with the star as its full stop; the facts in heavy capitals, justified; mono notes in the corners. -->
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Instrument+Serif&family=Martian+Mono:wght@500&display=block" rel="stylesheet">
<style>
:root{--stock:#EEE9DD;--cobalt:#1E3BD9;--orange:#F0642A;--ink:#151515}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden;background:var(--stock);color:var(--ink);font-family:'Familjen Grotesk',sans-serif}
#mark{position:absolute;left:70px;top:110px;width:420px;height:420px}
.mono{position:absolute;font-family:'Martian Mono',monospace;font-weight:500;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.tl{left:60px;top:44px}.tr{right:60px;top:44px;text-align:right}.bl{left:60px;bottom:40px}.br{right:60px;bottom:40px;text-align:right}
.wm{position:absolute;left:540px;top:150px;font-family:'Instrument Serif',serif;font-size:158px;line-height:.86;color:var(--cobalt)}
.star{width:.42em;height:.42em;vertical-align:.02em;margin-left:.04em}
.facts{position:absolute;left:546px;width:674px;top:340px;font-weight:700;font-size:52px;line-height:.92;text-transform:uppercase;letter-spacing:-.015em;word-spacing:.06em;}
.rule{position:absolute;left:546px;width:674px;top:486px;border-top:1.5px solid var(--ink)}
.cite{position:absolute;left:546px;top:504px;font-family:'Martian Mono',monospace;font-weight:500;font-size:22px;border:1.5px solid var(--ink);padding:3px 8px}
.cl{position:absolute;left:650px;top:504px;font-family:'Martian Mono',monospace;font-weight:500;font-size:22px;text-transform:uppercase;line-height:1.35}
</style></head><body>
<canvas id="mark" width="840" height="840"></canvas>
<div class="wm">ytmaxxing<svg class="star" viewBox="0 0 100 100"><path id="star" fill="none" stroke="#F0642A" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="50" r="8" fill="#F0642A"/></svg></div>
<div class="facts">Long YouTube videos into skills, plans and notes your AI keeps.</div>
<script type="module">
import { sampleImage, drawAscii } from "./vendor/ascii-magic-art/asciify.js";
const STAR=(()=>{let d='';for(let k=0;k<8;k++){const a=k*Math.PI/4+(k%2?0.12:-0.05),r=k%2?40:48;d+=`M50 50 Q ${50+Math.cos(a+0.2)*r*0.5} ${50+Math.sin(a+0.2)*r*0.5} ${50+Math.cos(a)*r} ${50+Math.sin(a)*r} `;}return d;})();
document.getElementById('star').setAttribute('d',STAR);
await document.fonts.load('500 40px "Familjen Grotesk"'); await document.fonts.ready;
const src=document.createElement('canvas'); src.width=400; src.height=400; const s=src.getContext('2d');
s.fillStyle='#fff'; s.fillRect(0,0,400,400); s.filter='blur(7px)'; s.fillStyle='#000'; s.scale(4,4);   // a soft edge, so the print thins out at the stroke edges
s.fill(new Path2D('M10 24L30 24L64 76L44 76ZM44 24L64 24L30 76L10 76ZM36 24L56 24L90 76L70 76ZM70 24L90 24L56 76L36 76Z'));
const g=document.getElementById('mark').getContext('2d'); g.fillStyle='#EEE9DD'; g.fillRect(0,0,840,840);
drawAscii(g, sampleImage(src,{cols:34,rows:34}), {x:0,y:0,w:840,h:840,look:'dense',gap:.26,gamma:.85,contrast:.6,colour:'solid',ink:'#1E3BD9',paper:'#EEE9DD',invert:true,blockTint:.5});
window.READY=true;
</script></body></html>
